[project]
name = "blendk"
version = "0.1.0"
description = "Stateful Blender control for agents and humans"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "typer>=0.24,<0.27",
]

[project.scripts]
blendk = "blendk.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-08-26T00:00:00Z"

[tool.uv.build-backend]
source-include = [
    ".python-version",
    "AGENTS.md",
    "constraints.txt",
    "docs/**",
    "skills/**",
    "tests/**",
    "uv.lock",
]
